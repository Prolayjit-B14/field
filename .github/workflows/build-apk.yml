name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Debug & Release APKs
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare APK outputs
        run: |
          mkdir -p build-apks
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AgriSense-Debug-APK
          path: build-apks/*debug*.apk
          retention-days: 14

      - name: Upload Release APK (Unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: AgriSense-Release-APK
          path: build-apks/*release*.apk
          retention-days: 14
